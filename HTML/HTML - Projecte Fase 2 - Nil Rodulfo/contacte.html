<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Fitxa Producte</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/estils.css">
        <link rel="icon" href="img/iconaTech.png">

        <!-- Carrego les fonts que utilitzarà la pàgina -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <div class="logo">
                <a href="index.html">
                    <img id="imatgeTitol" src="img/iconaTech.png"> <span id="titolPagina">Tech & Variables</span>
                </a>
            </div>

            <nav>
                <ul>
                    <li><a href="index.html">Catàleg</a></li>
                    <li><a href="fitxa.html">Fitxa</a></li>
                    <li><a href="contacte.html" id="actual">Contacte</a></li>
                </ul>
            </nav>
        </header>
        <h1>Podem ajudar-te?</h1>
        <article id="contacte">
            <div>
                <h2>Contacta amb nosaltres</h2>
                <form action="#" method="POST">
                    <label for="name">Nom i cognoms: </label>
                    <input type="text" id="name" name="name" placeholder="María García"><br>
                    
                    <label for="email">Correu electrònic</label>
                    <input type="email" id="email" name="email" placeholder="maria.garcia@gmail.com"><br>
                    
                    <label for="phone">Telèfon de contacte</label>
                    <input type="text" id="phone" name="phone" placeholder="123 456 789"><br>
                    
                    <label for="motiuConsulta">Motiu de consulta</label>
                    <select id="motiuConsulta">
                        <option value="papers">Papers</option>
                        <option value="interna">Gestió interna</option>
                        <option value="externa">Gestió externa</option>
                    </select><br>
                    
                    <label for="metodeContacte">Com prefereixes que et contactem?</label><br>
                    <input type="radio" id="contacte_email" name="contacte" value="Email"/>
                    <label for="contacte_email">Correu electrònic</label>
                    <input type="radio" id="contacte_telefon" name="contacte" value="Telefon"/>
                    <label for="contacte_email">Telefon / Whatsapp</label>
                    <br>
                    
                    <label for="missatge">Missatge</label><br>
                    <input type="text" id="missatge" name="missatge" placeholder="Escriu aquí el teu missatge..."><br>
                    
                    <input type="checkbox" id="politicaPrivacitat" name="politicaPrivacitat">
                    <label for="politicaPrivacitat">Accepto la política de privacitat</label><br>
                    
                    <input type="submit" value="Enviar missatge">
                    <input type="reset" value="Netejar">
                </form>
            </div>
            <div>
                <h2>O pots trobar-nos a...</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d666.0275513514805!2d2.1866419052919452!3d41.45305210130204!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a4bcfdad2100a9%3A0x3c4e7db0a61a83e0!2sITB%20-%20Institut%20Tecnol%C3%B2gic%20de%20Barcelona!5e0!3m2!1sca!2ses!4v1794221191797!5m2!1sca!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </article>
    </body>
</html>
