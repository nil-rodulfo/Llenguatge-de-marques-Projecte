<!DOCTYPE html>
<html lang="ca">

    <head>

        <title>Tech & Variables</title>
        <link rel="stylesheet" href="css/estils.css">
        <link rel="icon" href="img/iconaTech.png">

        <!-- Carrego les fonts que utilitzarà la pàgina -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        
        <!-- Carrego els scripts que usarà la pàgina -->
        <script src="js/cataleg.js" defer></script>
        <script src="js/index.js" defer></script>
        <script src="js/tema.js" defer></script>
    </head>

    <body>
        <header>
            <div class="logo">
                <a href="index.html">
                    <img id="imatgeTitol" src="img/iconaTech.png" alt="Logotip Tech & Variables">
                    <span id="titolPagina">Tech & Variables</span>
                </a>
            </div>
            
            <button id="boto-tema">Veintitres</button>
            <nav>
                <ul>
                    <li><a href="index.html" id="actual">Catàleg</a></li>
                    <li><a href="fitxa.html">Fitxa</a></li>
                    <li><a href="contacte.html">Contacte</a></li>
                </ul>
            </nav>

        <main>
            <section id="capcalera-cataleg">
                <h1>El nostre catàleg de productes</h1>
                <p>Productes que t'ajudaran en tots i qualsevol projecte, sempre al millor preu.</p>
            </section>

            <section id="cerca">
                <input type="text" id="cercaTitol" placeholder="Nom del producte">
                <select id="cercaCategoria">
                    <option value="totes">Totes</option>
                    <option value="Electrònica">Electrònica</option>
                    <option value="Accesoris">Accesoris</option>
                    <option value="Perifèrics">Perifèrics</option>
                    <option value="Dispositius">Dispositius</option>
                </select>
            </section>

            <section class="catalogo" aria-label="Productes disponibles">
            </section>

            <p>Visita també el nostre soci <a href="https://www.pccomponentes.com/" target="_blank">PcComponentes</a></p>

        <footer>
            <p>© 2026 Tech & Variables. Tots els drets reservats.</p>
